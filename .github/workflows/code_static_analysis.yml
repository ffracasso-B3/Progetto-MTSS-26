name: Java CI static analysis

on: 
    [push, pull_request]

jobs: 
    static-analysis:
     runs-on: ubuntu-latest

     steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
         distribution: 'temurin'
         java-version: '21'
         cache: 'maven'
      
      - name: Run analysis
        run: mvn checkstyle:checkstyle